name: event-sourcing-test-v2

services:
    # Symfony Backend Service (FrankenPHP)
    symfony-api-test:
        build:
            context: ../../
            dockerfile: docker/dev/Dockerfile
        container_name: symfony-api-test
        ports:
            - '${TEST_BIND_HOST:-127.0.0.1}:9080:80'
            - '${TEST_BIND_HOST:-127.0.0.1}:${TEST_HTTPS_PORT:-9444}:443'
            - '${TEST_BIND_HOST:-127.0.0.1}:${TEST_HTTPS_PORT:-9444}:443/udp'
        env_file:
            - ../../.env
            - ../../.env.test
        environment:
            - SERVER_NAME=:80
            - DATABASE_URL=postgresql://user:password@postgres-db-test:5432/event_sourcing_test?serverVersion=16&charset=utf8
            - APP_ENV=test
            - APP_DEBUG=0
        volumes:
            - ../../:/app
            - ./symfony/caddy_data:/data
            - ./symfony/caddy_config:/config
        networks:
            - app-network-test
        depends_on:
            postgres-test:
                condition: service_healthy
            mongodb-test:
                condition: service_healthy
            queue-db-test:
                condition: service_healthy
            redis-test:
                condition: service_healthy
            kafka-test:
                condition: service_healthy
        restart: unless-stopped
        tty: true

    # Postgres Database
    postgres-test:
        image: postgres:16-alpine
        container_name: postgres-db-test
        environment:
            - POSTGRES_USER=user
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
            - POSTGRES_DB=event_sourcing_test
        ports:
            - '${TEST_BIND_HOST:-127.0.0.1}:5434:5432'
        volumes:
            - ./postgres/data:/var/lib/postgresql/data
        networks:
            - app-network-test
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U user -d event_sourcing_test']
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 120s
        restart: unless-stopped

    # MongoDB for Event Store
    mongodb-test:
        image: mongodb/mongodb-community-server:7.0-ubuntu2204
        container_name: mongodb-test
        user: '0:0'
        ports:
            - '${TEST_BIND_HOST:-127.0.0.1}:27018:27017'
        environment:
            - MONGODB_INITDB_ROOT_USERNAME=root
            - MONGODB_INITDB_ROOT_PASSWORD=${MONGODB_INITDB_ROOT_PASSWORD:-password}
        volumes:
            - ./mongodb/data:/data/db
        networks:
            - app-network-test
        healthcheck:
            test: ['CMD', 'mongosh', '--norc', '--quiet', '--eval', 'quit()']
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 120s
        restart: unless-stopped

    # MongoDB Web Viewer
    mongo-express-test:
        image: mongo-express
        container_name: mongo-express-test
        ports:
            - '${TEST_BIND_HOST:-127.0.0.1}:9083:8081'
        environment:
            - ME_CONFIG_MONGODB_ADMINUSERNAME=root
            - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGODB_INITDB_ROOT_PASSWORD:-password}
            - ME_CONFIG_MONGODB_URL=mongodb://root:${MONGODB_INITDB_ROOT_PASSWORD:-password}@mongodb-test:27017/
            - ME_CONFIG_BASICAUTH_USERNAME=user
            - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD:-password}
        networks:
            - app-network-test
        depends_on:
            - mongodb-test
        restart: unless-stopped

    # n8n Automation Tool
    automation-test:
        image: n8nio/n8n
        container_name: automation-test
        ports:
            - '${TEST_BIND_HOST:-127.0.0.1}:9082:5678'
        environment:
            - N8N_USER_MANAGEMENT_DISABLED=true
            - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
            - DB_TYPE=postgresdb
            - DB_POSTGRESDB_HOST=postgres-test
            - DB_POSTGRESDB_PORT=5432
            - DB_POSTGRESDB_DATABASE=event_sourcing_test
            - DB_POSTGRESDB_USER=user
            - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD:-password}
        volumes:
            - ./n8n/data:/home/node/.n8n
        networks:
            - app-network-test
        depends_on:
            postgres-test:
                condition: service_healthy
        restart: unless-stopped

    # Adminer Database Management
    adminer-test:
        image: adminer
        container_name: adminer-test
        ports:
            - '${TEST_BIND_HOST:-127.0.0.1}:9081:8080'
        networks:
            - app-network-test
        depends_on:
            postgres-test:
                condition: service_healthy
            queue-db-test:
                condition: service_healthy
        restart: unless-stopped

    # Queue Database (PostgreSQL)
    queue-db-test:
        image: postgres:16-alpine
        container_name: queue-db-test
        environment:
            - POSTGRES_DB=messenger_queue_test
            - POSTGRES_USER=queue_user
            - POSTGRES_PASSWORD=${QUEUE_POSTGRES_PASSWORD:-queue_password}
        ports:
            - '${TEST_BIND_HOST:-127.0.0.1}:5435:5432'
        volumes:
            - ./postgres-queue/data:/var/lib/postgresql/data
        networks:
            - app-network-test
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U queue_user -d messenger_queue_test']
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 120s
        restart: unless-stopped

    # Redis Queue Backend
    redis-test:
        image: redis:7-alpine
        container_name: queue-redis-test
        command: ['redis-server', '--appendonly', 'yes']
        ports:
            - '${TEST_BIND_HOST:-127.0.0.1}:6381:6379'
        volumes:
            - ./redis/data:/data
        networks:
            - app-network-test
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s
        restart: unless-stopped

    # Kafka Queue Backend (KRaft)
    kafka-test:
        image: apache/kafka:3.9.0
        container_name: queue-kafka-test
        ports:
            - '${TEST_BIND_HOST:-127.0.0.1}:9094:9092'
        environment:
            - KAFKA_NODE_ID=1
            - KAFKA_PROCESS_ROLES=broker,controller
            - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
            - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-test:9092
            - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
            - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-test:9093
            - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
            - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
            - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
            - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
        volumes:
            - ./kafka/data:/tmp/kraft-combined-logs
        networks:
            - app-network-test
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1'
                ]
            interval: 10s
            timeout: 10s
            retries: 30
            start_period: 60s
        restart: unless-stopped

    # Redis UI (RedisInsight)
    redisinsight-test:
        image: redis/redisinsight:latest
        container_name: redisinsight-test
        ports:
            - '${TEST_BIND_HOST:-127.0.0.1}:9084:5540'
        volumes:
            - ./redisinsight/data:/data
        networks:
            - app-network-test
        depends_on:
            redis-test:
                condition: service_healthy
        restart: unless-stopped

    # Kafka UI (Provectus)
    kafka-ui-test:
        image: provectuslabs/kafka-ui:latest
        container_name: kafka-ui-test
        ports:
            - '${TEST_BIND_HOST:-127.0.0.1}:9085:8080'
        environment:
            - KAFKA_CLUSTERS_0_NAME=test
            - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-test:9092
        networks:
            - app-network-test
        depends_on:
            kafka-test:
                condition: service_healthy
        restart: unless-stopped

    # Messenger Worker (Supervisor)
    messenger-worker-test:
        build:
            context: ../../
            dockerfile: docker/dev/Dockerfile
        container_name: messenger-worker-test
        entrypoint:
            ['/usr/bin/supervisord', '-n', '-c', '/etc/supervisor/conf.d/messenger-worker.conf']
        user: root
        ports:
            - '${TEST_BIND_HOST:-127.0.0.1}:9002:9001'
        volumes:
            - ../../:/app
            - ./worker/supervisord.conf:/etc/supervisor/conf.d/messenger-worker.conf:ro
        env_file:
            - ../../.env
            - ../../.env.test
        depends_on:
            queue-db-test:
                condition: service_healthy
            postgres-test:
                condition: service_healthy
            redis-test:
                condition: service_healthy
            kafka-test:
                condition: service_healthy
        networks:
            - app-network-test
        restart: unless-stopped

networks:
    app-network-test:
        driver: bridge

framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: async
                    auto_setup: true
                retry_strategy:
                    service: messenger.retry_strategy.recoverable
            failed:
                dsn: 'doctrine://messaging?queue_name=failed'
                options:
                    auto_setup: true
            sync: 'sync://'

        routing:
            # Route your messages to the transports
            'App\Application\Command\CreateUserCommand': async
            'App\Application\Command\UpdateUserCommand': async
            'App\Application\Command\DeleteUserCommand': async
            # Or use wildcard if supported, but explicit is safer for now as I see specific files.
            # Actually, I can use interface based routing if they implement something like AsyncMessageInterface.
            # But let's stick to explicit for the known commands or namespace.
            'App\Application\Command\*': async
            'App\Domain\Event\*': async


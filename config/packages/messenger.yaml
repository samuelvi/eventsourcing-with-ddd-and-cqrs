framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: async
                    auto_setup: true
                retry_strategy:
                    service: messenger.retry_strategy.recoverable
            failed:
                dsn: 'doctrine://messaging?queue_name=failed'
                options:
                    auto_setup: true
            sync: 'sync://'

        routing:
            # Route your messages to the transports
            # Default command routing is async.
            # Sync behavior is explicitly selected by SyncCommandBusInterface (TransportNamesStamp('sync')).
            'App\Application\Command\*': async
            'App\Domain\Event\*': async


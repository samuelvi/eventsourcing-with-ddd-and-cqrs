framework:
    messenger:
        transports:
            # This makes the test environment async, using the DSN from .env.test
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
        routing:
            'App\Application\Command\*': async
            'App\Domain\Event\*': async
            # Route test fixtures to async as well
            'App\Tests\Infrastructure\Messenger\Fixtures\*': async

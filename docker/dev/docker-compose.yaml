name: event-sourcing-dev

services:
    # Symfony Backend Service (FrankenPHP)
    symfony-api:
        build:
            context: ../../
            dockerfile: docker/dev/Dockerfile
        container_name: symfony-api
        ports:
            - '${DEV_BIND_HOST:-127.0.0.1}:8080:80'
            - '${DEV_BIND_HOST:-127.0.0.1}:443:443'
            - '${DEV_BIND_HOST:-127.0.0.1}:443:443/udp'
        env_file:
            - ../../.env
        environment:
            - SERVER_NAME=:80
            - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST:-postgres-db}:${DB_PORT:-5432}/${POSTGRES_DB}?serverVersion=16&charset=utf8
            - APP_ENV=dev
            - APP_DEBUG=1
            - TRUSTED_PROXIES=127.0.0.1,REMOTE_ADDR
            - CORS_ALLOW_ORIGIN=^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$
        volumes:
            - ../../:/app
            - ../../var/log:/app/var/log
            - ./symfony/caddy_data:/data
            - ./symfony/caddy_config:/config
        networks:
            - app-network
        depends_on:
            postgres:
                condition: service_healthy
            mongodb:
                condition: service_healthy
            queue-db:
                condition: service_healthy
            redis:
                condition: service_healthy
            kafka:
                condition: service_healthy
        restart: unless-stopped
        tty: true

    # Node/Vite Service for Frontend
    node:
        image: node:20-alpine
        container_name: node-vite
        working_dir: /app
        volumes:
            - ../../:/app
        ports:
            - '${DEV_BIND_HOST:-127.0.0.1}:5173:5173'
        command: ['sh', '-c', 'npm install && npm run dev -- --host']
        networks:
            - app-network
        restart: unless-stopped

    # Postgres Database
    postgres:
        image: postgres:16-alpine
        container_name: postgres-db
        env_file:
            - ../../.env.dev
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        ports:
            - '${DB_EXTERNAL_PORT:-5433}:5432'
        volumes:
            - ./postgres/data:/var/lib/postgresql/data
            - ./postgres/init:/docker-entrypoint-initdb.d
        networks:
            - app-network
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 120s
        restart: unless-stopped

    # n8n Automation Tool
    n8n:
        image: n8nio/n8n:latest
        container_name: n8n
        ports:
            - '${DEV_BIND_HOST:-127.0.0.1}:5678:5678'
        env_file:
            - ../../.env
        environment:
            - N8N_HOST=${N8N_HOST:-localhost}
            - N8N_PORT=${N8N_PORT:-5678}
            - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
            - N8N_EDITOR_BASE_URL=http://localhost:5678
            - NODE_ENV=${NODE_ENV}
            - WEBHOOK_URL=${WEBHOOK_URL}
            - EXECUTIONS_MODE=queue
            - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
            - DB_TYPE=postgresdb
            - DB_POSTGRESDB_HOST=${N8N_DB_HOST:-postgres}
            - DB_POSTGRESDB_PORT=${N8N_DB_PORT:-5432}
            - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-event_sourcing_dev}
            - DB_POSTGRESDB_USER=${N8N_DB_USER:-user}
            - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:-password}
            - QUEUE_BULL_REDIS_HOST=${N8N_REDIS_HOST:-redis}
            - QUEUE_BULL_REDIS_PORT=${N8N_REDIS_PORT:-6379}
            - QUEUE_BULL_REDIS_DB=${N8N_REDIS_DB:-0}
            - N8N_USER_MANAGEMENT_DISABLED=true
            - N8N_PERSONALIZATION_ENABLED=false
            - N8N_METRICS_ENABLED=false
            - N8N_SECURE_COOKIE=false
            - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
        volumes:
            - ./n8n/data:/home/node/.n8n
        networks:
            - app-network
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    # n8n Queue Worker
    n8n-worker:
        image: n8nio/n8n:latest
        command: worker --concurrency=${N8N_WORKER_CONCURRENCY:-5}
        env_file:
            - ../../.env
        environment:
            - NODE_ENV=${NODE_ENV}
            - EXECUTIONS_MODE=queue
            - DB_TYPE=postgresdb
            - DB_POSTGRESDB_HOST=${N8N_DB_HOST:-postgres}
            - DB_POSTGRESDB_PORT=${N8N_DB_PORT:-5432}
            - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-event_sourcing_dev}
            - DB_POSTGRESDB_USER=${N8N_DB_USER:-user}
            - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:-password}
            - QUEUE_BULL_REDIS_HOST=${N8N_REDIS_HOST:-redis}
            - QUEUE_BULL_REDIS_PORT=${N8N_REDIS_PORT:-6379}
            - QUEUE_BULL_REDIS_DB=${N8N_REDIS_DB:-0}
            - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
        volumes:
            - ./n8n/data:/home/node/.n8n
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - app-network
        restart: unless-stopped

    # MongoDB for Event Store and Checkpoints
    mongodb:
        image: mongodb/mongodb-community-server:7.0-ubuntu2204
        container_name: mongodb
        user: '0:0'
        ports:
            - '${DEV_BIND_HOST:-127.0.0.1}:27017:27017'
        environment:
            - MONGODB_INITDB_ROOT_USERNAME=root
            - MONGODB_INITDB_ROOT_PASSWORD=${MONGODB_INITDB_ROOT_PASSWORD:-password}
        volumes:
            - ./mongodb/data:/data/db
        networks:
            - app-network
        healthcheck:
            test: ['CMD', 'mongosh', '--norc', '--quiet', '--eval', 'quit()']
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 120s
        restart: unless-stopped

    # MongoDB Web Viewer
    mongo-express:
        image: mongo-express
        container_name: mongo-express
        ports:
            - '${DEV_BIND_HOST:-127.0.0.1}:8082:8081'
        environment:
            - ME_CONFIG_MONGODB_ADMINUSERNAME=root
            - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGODB_INITDB_ROOT_PASSWORD:-password}
            - ME_CONFIG_MONGODB_URL=mongodb://root:${MONGODB_INITDB_ROOT_PASSWORD:-password}@mongodb:27017/
            - ME_CONFIG_BASICAUTH_USERNAME=user
            - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD:-password}
        networks:
            - app-network
        depends_on:
            - mongodb
        restart: unless-stopped

    # Adminer Database Management
    adminer:
        image: adminer
        container_name: adminer
        ports:
            - '${DEV_BIND_HOST:-127.0.0.1}:8081:8080'
        env_file:
            - ../../.env
        networks:
            - app-network
        depends_on:
            postgres:
                condition: service_healthy
            queue-db:
                condition: service_healthy
        restart: unless-stopped

    # Queue Database (PostgreSQL)
    queue-db:
        image: postgres:16-alpine
        container_name: queue-db
        environment:
            - POSTGRES_DB=messenger_queue
            - POSTGRES_USER=queue_user
            - POSTGRES_PASSWORD=${QUEUE_POSTGRES_PASSWORD:-queue_password}
        ports:
            - '${DEV_BIND_HOST:-127.0.0.1}:${QUEUE_DB_EXTERNAL_PORT:-5436}:5432'
        volumes:
            - ./postgres-queue/data:/var/lib/postgresql/data
        networks:
            - app-network
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U queue_user -d messenger_queue']
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 120s
        restart: unless-stopped

    # Redis Queue Backend
    redis:
        image: redis:7-alpine
        container_name: queue-redis
        command: ['redis-server', '--appendonly', 'yes']
        ports:
            - '${DEV_BIND_HOST:-127.0.0.1}:${QUEUE_REDIS_EXTERNAL_PORT:-6380}:6379'
        volumes:
            - ./redis/data:/data
        networks:
            - app-network
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s
        restart: unless-stopped

    # Kafka Queue Backend (KRaft)
    kafka:
        image: apache/kafka:3.9.0
        container_name: queue-kafka
        ports:
            - '${DEV_BIND_HOST:-127.0.0.1}:${QUEUE_KAFKA_EXTERNAL_PORT:-9092}:9092'
        environment:
            - KAFKA_NODE_ID=1
            - KAFKA_PROCESS_ROLES=broker,controller
            - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
            - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
            - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
            - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
            - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
            - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
            - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
            - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
            - KAFKA_MESSAGE_MAX_BYTES=10485760
            - KAFKA_FETCH_MESSAGE_MAX_BYTES=10485760
            - KAFKA_REPLICA_FETCH_MAX_BYTES=10485760
        volumes:
            - ./kafka/data:/tmp/kraft-combined-logs
        networks:
            - app-network
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1'
                ]
            interval: 10s
            timeout: 10s
            retries: 30
            start_period: 60s
        restart: unless-stopped

    # Redis UI (RedisInsight)
    redisinsight:
        image: redis/redisinsight:latest
        container_name: redisinsight
        user: '0:0'
        ports:
            - '${DEV_BIND_HOST:-127.0.0.1}:8084:5540'
        volumes:
            - ./redisinsight/data:/data
        networks:
            - app-network
        depends_on:
            redis:
                condition: service_healthy
        restart: unless-stopped

    # Kafka UI (Provectus)
    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: kafka-ui
        ports:
            - '${DEV_BIND_HOST:-127.0.0.1}:8085:8080'
        environment:
            - KAFKA_CLUSTERS_0_NAME=local
            - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
        networks:
            - app-network
        depends_on:
            kafka:
                condition: service_healthy
        restart: unless-stopped

    # Messenger Worker (Supervisor)
    messenger-worker:
        build:
            context: ../../
            dockerfile: docker/dev/Dockerfile
        container_name: messenger-worker
        entrypoint:
            ['/usr/bin/supervisord', '-n', '-c', '/etc/supervisor/conf.d/messenger-worker.conf']
        user: root
        ports:
            - '${DEV_BIND_HOST:-127.0.0.1}:9001:9001'
        volumes:
            - ../../:/app
            - ./worker/supervisord.conf:/etc/supervisor/conf.d/messenger-worker.conf:ro
        env_file:
            - ../../.env
        depends_on:
            queue-db:
                condition: service_healthy
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            kafka:
                condition: service_healthy
        networks:
            - app-network
        restart: unless-stopped

networks:
    app-network:
        driver: bridge
